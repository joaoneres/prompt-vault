[project]
name = "prompt-vault-api"
version = "0.1.0"
description = "HTTP API for Prompt Vault, talking to the core over NATS"
requires-python = ">=3.13.7"
dependencies = [
    "fastapi>=0.115.0",
    "nats-py>=2.16.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
